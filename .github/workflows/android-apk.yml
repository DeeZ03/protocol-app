name: Build Android APK

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Protocol
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle downloads and build outputs
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare Protocol branding assets
        run: |
          mkdir -p assets
          cp file_000000000bcc820cbdbc09c76f6eb270.png assets/icon.png

      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Configure local release signing for test APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s = s.replace('signingConfig signingConfigs.release', 'signingConfig signingConfigs.debug')
          p.write_text(s)
          PY

      - name: Build standalone APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: protocol-android-standalone-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
