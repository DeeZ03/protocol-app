name: Validate Protocol translations

on:
  push:
    branches: [main]
    paths:
      - 'src/i18n/**'
      - 'app/**'
      - 'src/**'
      - 'scripts/check-translations.cjs'
      - 'package.json'
      - '.github/workflows/translation-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  translations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Protocol
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate bilingual translations
        run: node scripts/check-translations.cjs
      - name: Check TypeScript
        run: npm run check
